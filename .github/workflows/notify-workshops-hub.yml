# Tells Forecasting-for-Social-Good/workshops to pull in this repo's latest
# gh-pages commit (as the `africast` submodule) right after it's published,
# instead of waiting for that repo's weekly fallback poll.
#
# This site is published by running `quarto publish gh-pages` locally, which
# replaces the entire gh-pages tree with the freshly rendered output on every
# publish -- so a workflow file living only on gh-pages would (a) never
# actually trigger a `push`-scoped workflow, since GitHub only evaluates
# on.push workflows using the file as it exists in the ref being pushed, and
# (b) get wiped by the next publish even if it somehow got there. `page_build`
# sidesteps both problems: GitHub fires it whenever it finishes building
# Pages from the branch configured as the publishing source (Settings ->
# Pages; currently gh-pages, "legacy"/branch build type here), and evaluates
# it from workflow files on the *default* branch (main), which quarto's
# publish never touches.
#
# One-time setup (already done if this comment has been removed):
#   1. Create a token able to dispatch to Forecasting-for-Social-Good/workshops:
#      https://github.com/settings/personal-access-tokens/new, scoped to
#      *only* that repository, permission Contents: Read and write. (A
#      classic PAT with the `repo` scope also works, but is far broader than
#      needed.)
#   2. Add it as a secret named WORKSHOPS_HUB_TOKEN in *this* repo
#      (Settings -> Secrets and variables -> Actions), e.g.:
#        gh secret set WORKSHOPS_HUB_TOKEN --repo Forecasting-for-Social-Good/workshop-f4sg-africast
name: Notify workshops hub

on:
  page_build: {}
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    # page_build fires even when the Pages build fails; only notify on success.
    if: github.event_name == 'workflow_dispatch' || github.event.build.state == 'built'
    steps:
      - name: Dispatch update to Forecasting-for-Social-Good/workshops
        env:
          GH_TOKEN: ${{ secrets.WORKSHOPS_HUB_TOKEN }}
        run: |
          gh api repos/Forecasting-for-Social-Good/workshops/dispatches \
            -f event_type=gh-pages-updated \
            -f "client_payload[repo]=${{ github.repository }}" \
            -f "client_payload[sha]=${{ github.sha }}"
