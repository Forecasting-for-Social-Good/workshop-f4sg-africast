# Schema for the live-questions extension
$schema: https://m.canouil.dev/quarto-wizard/assets/schema/v2/extension-schema.json

# Deck-level options. Set them under `extensions: live-questions:` or
# top-level `live-questions:`; a key set in both takes the top-level value.
options:
  server:
    type: string
    pattern: "^https?://[^/]+/*$"
    format: uri
    description: "Origin of the Live Questions server, such as https://live-questions.example.org. Without it, questions render as static lists."
    examples: ["http://localhost:8787"]
  session:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
    description: "Session name shared by the deck and the audience page. Defaults to the input file name."
  close-on-leave:
    type: boolean
    default: true
    description: "Close a question's voting when the presenter leaves its slide."
  results:
    type: string
    enum: [live, hidden]
    default: live
    description: "Whether results show on the slide as votes arrive (live) or stay hidden until the presenter presses T (hidden)."
  qr:
    type: boolean
    default: true
    description: "Show the QR code and short audience URL on question slides."

classes:
  poll:
    description: "Multiple-choice question: the div's list items are the options, and task-list items marked [x] are correct answers."
  wordcloud:
    description: "Short free-text question shown as a live word cloud."
  likert:
    description: "Rating question: each list item is a statement rated on one shared scale."

attributes:
  poll:
    prompt:
      type: string
      maxLength: 500
      description: "Question text. Defaults to the text in the div, else the preceding slide heading."
    results:
      type: string
      enum: [live, hidden]
      description: "Override the deck-level results option for this question."
  wordcloud:
    prompt:
      type: string
      maxLength: 500
      description: "Question text. Defaults to the text in the div, else the preceding slide heading."
    results:
      type: string
      enum: [live, hidden]
      description: "Override the deck-level results option for this question."
    max-words:
      type: integer
      minimum: 1
      maximum: 10
      default: 3
      description: "Most words allowed in one answer."
    max-answers:
      type: integer
      minimum: 1
      maximum: 10
      default: 3
      description: "Most answers one participant may submit."
  likert:
    prompt:
      type: string
      maxLength: 500
      description: "Question text. Defaults to the text in the div, else the preceding slide heading. Without a list, the prompt is the single statement."
    results:
      type: string
      enum: [live, hidden]
      description: "Override the deck-level results option for this question."
    scale:
      type: string
      pattern: "^\\s*(agree-5|agree-7|\\d+\\s*-\\s*\\d+)\\s*$"
      default: agree-5
      description: "Rating scale: agree-5, agree-7, or a numeric range of 2 to 11 points such as 0-10 or 1-5."
      completion:
        type: enum
        values: [agree-5, agree-7, 1-5, 1-7, 0-10]
    labels:
      type: string
      pattern: "^[^|]*(\\|[^|]*){1,10}$"
      description: "Custom scale of 2 to 11 labels separated by |, such as \"Too slow|About right|Too fast\". Takes precedence over scale."
    low:
      type: string
      maxLength: 40
      description: "Label for the low end of a numeric scale."
    high:
      type: string
      maxLength: 40
      description: "Label for the high end of a numeric scale."
